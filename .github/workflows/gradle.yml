name: Gradle Build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: rundeck-plugins/.github/.github/actions/setup-java@main
      - name: Get Fetch Tags
        run: git -c protocol.version=2 fetch --tags --progress --no-recurse-submodules origin
        if: "!contains(github.ref, 'refs/tags')"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Get Release Version
        id: get_version
        run: VERSION=$(./gradlew currentVersion -q -Prelease.quiet) && echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload artifact zip
        uses: rundeck-plugins/.github/.github/actions/upload-artifact@main
        with:
          # Artifact name
          name: kubernetes-${{ steps.get_version.outputs.VERSION }}
          # Directory containing files to upload
          path: build/libs/kubernetes-${{ steps.get_version.outputs.VERSION }}.zip
